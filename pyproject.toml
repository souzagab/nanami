description = ""
authors = ["Gabriel S. <thesouzagab@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["all"], version = "^0.115.12"}
gunicorn = "^23.0.0"
