<div class="space-y-6">
    <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
        <input type="text" name="name" id="name" value="{{ mapping.name if mapping else '' }}" required
               class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
    </div>

    <div>
        <label for="account_type" class="block text-sm font-medium text-gray-700">Account Type</label>
        <select id="account_type" name="account_type" required
                class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            {% for type in account_mapping_types %}
                <option value="{{ type.value }}" {% if mapping and mapping.account_type == type %}selected{% endif %}>{{ type.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label for="pluggy_item_id" class="block text-sm font-medium text-gray-700">Pluggy Item ID</label>
        <input type="text" name="pluggy_item_id" id="pluggy_item_id" value="{{ mapping.pluggy_item_id if mapping else '' }}" required
               class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
    </div>

    <div>
        <label for="pluggy_account_id" class="block text-sm font-medium text-gray-700">Pluggy Account ID</label>
        <input type="text" name="pluggy_account_id" id="pluggy_account_id" value="{{ mapping.pluggy_account_id if mapping else '' }}" required
               class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
    </div>

    <div>
        <label for="ynab_account_id" class="block text-sm font-medium text-gray-700">YNAB Account ID</label>
        <input type="text" name="ynab_account_id" id="ynab_account_id" value="{{ mapping.ynab_account_id if mapping else '' }}" required
               class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
    </div>

    <div>
        <label for="status" class="block text-sm font-medium text-gray-700">Status</label>
        <select id="status" name="status" required
                class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            {% for status_option in account_mapping_status %}
                <option value="{{ status_option.value }}" {% if mapping and mapping.status == status_option %}selected{% elif not mapping and status_option.value == 'ACTIVE' %}selected{% endif %}>{{ status_option.name }}</option>
            {% endfor %}
        </select>
    </div>
</div>
